version: '3.8'

services:
  antigravity:
    image: jklinker/antigravity-docker:latest
    container_name: antigravity
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      - PUID=1000
      - PGID=1000
      - RC_NAME=server-agent
      - AGY_PORT=4400
      - AUTH_PASSWORD=changeme
      - BLOCK_TELEMETRY=true
      - ENABLE_IDE=true
      - ENABLE_TERMINAL=true
      - HOST_SSH_USER=
      - HOST_SSH_HOST=host.docker.internal
      - HOST_SSH_PORT=22
      - HOST_SSH_DIR=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/workspace
      - ./data/gemini:/home/developer/.gemini
      - ./data/ssh:/home/developer/.ssh
      - ./data/gitconfig:/home/developer/.gitconfig
